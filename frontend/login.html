<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heimdall — Sign in</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: #0e0e0f;
  color: #f0ede8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.wrap { width: 360px; max-width: 92vw; }

/* ── Logo ── */
.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 32px;
}
.logo-icon {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, #e8533a, #e89240);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.logo-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .06em;
}
.logo-sub {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: #3e3d3b;
  letter-spacing: .1em;
  margin-left: auto;
  white-space: nowrap;
}

/* ── Card ── */
.card {
  background: #141415;
  border: 1px solid #2a2a2d;
  border-radius: 12px;
  padding: 28px;
}
.card-title { font-size: 17px; font-weight: 600; margin-bottom: 3px; }
.card-sub   { font-size: 12px; color: #5a5956; margin-bottom: 22px; }

/* ── Labels ── */
label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #3e3d3b;
  margin-bottom: 5px;
}

/* ── Inputs ── */
.input-wrap { position: relative; margin-bottom: 16px; }
input[type=text],
input[type=password] {
  width: 100%;
  padding: 10px 40px 10px 12px;
  background: #1c1c1e;
  border: 1px solid #2a2a2d;
  border-radius: 7px;
  color: #f0ede8;
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  outline: none;
  transition: border-color .18s;
  -webkit-font-smoothing: antialiased;
}
input:focus { border-color: #5b8ef0; }
input::placeholder { color: #3e3d3b; }

.eye {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #3e3d3b;
  background: none;
  border: none;
  padding: 3px;
  display: flex;
  align-items: center;
  transition: color .15s;
}
.eye:hover { color: #5a5956; }

/* ── Submit ── */
.btn-submit {
  width: 100%;
  margin-top: 4px;
  padding: 11px;
  border-radius: 7px;
  border: none;
  background: linear-gradient(135deg, #e8533a, #e89240);
  color: #fff;
  font-size: 13px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .12s;
  letter-spacing: .03em;
}
.btn-submit:hover:not(:disabled) { opacity: .88; }
.btn-submit:active:not(:disabled){ transform: scale(.98); }
.btn-submit:disabled {
  background: #1c1c1e;
  color: #3e3d3b;
  cursor: not-allowed;
}

/* ── Error ── */
.error {
  margin-top: 14px;
  font-size: 12px;
  color: #e8533a;
  background: rgba(232,83,58,.1);
  padding: 9px 13px;
  border-radius: 6px;
  border: 1px solid rgba(232,83,58,.22);
  display: none;
  line-height: 1.5;
}

/* ── Footer ── */
.page-footer {
  margin-top: 22px;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: #2a2a2d;
  letter-spacing: .06em;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6L12 2z"
              fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.7"
              stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="#e8533a" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="logo-name">Heimdall</span>
    <span class="logo-sub">IDS DASHBOARD</span>
  </div>

  <div class="card">
    <div class="card-title">Sign in</div>
    <div class="card-sub">Enter your credentials to access the dashboard</div>

    <label for="un">Username</label>
    <div class="input-wrap" style="margin-bottom: 16px">
      <input type="text" id="un" placeholder="username" autocomplete="username" autofocus>
    </div>

    <label for="pw">Password</label>
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="••••••••••••" autocomplete="current-password">
      <button class="eye" id="eye-btn" type="button" title="Show / hide password">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="btn-submit" id="submit-btn" type="button">Sign in</button>
    <div class="error" id="error-msg"></div>
  </div>

  <div class="page-footer">SURICATA IDS · ZERO DEPENDENCIES · PYTHON 3.10+</div>

</div>
<script src="/frontend/login.js"></script>
</body>
</html>
