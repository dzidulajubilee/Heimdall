<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heimdall IDS</title>

<!-- React 18 + Babel (zero npm) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="stylesheet" href="/frontend/styles.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }

/* ══════════════════════════════════════════════════════════════
   THEME: Night (default — warm charcoal)
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg:    #0e0e0f;
  --s1:    #141415;
  --s2:    #1c1c1e;
  --s3:    #252527;
  --s4:    #2e2e31;
  --ln:    #2a2a2d;
  --ln2:   #343438;

  --tx1:   #f0ede8;
  --tx2:   #8a8784;
  --tx3:   #3e3d3b;
  --tx4:   #5a5956;

  --sev-critical:    #e8533a;
  --sev-critical-bg: rgba(232,83,58,.12);
  --sev-high:        #e89240;
  --sev-high-bg:     rgba(232,146,64,.12);
  --sev-medium:      #d4ac3a;
  --sev-medium-bg:   rgba(212,172,58,.12);
  --sev-low:         #43b57a;
  --sev-low-bg:      rgba(67,181,122,.12);
  --sev-info:        #5b8ef0;
  --sev-info-bg:     rgba(91,142,240,.12);

  --accent:          #5b8ef0;
  --accent-bg:       rgba(91,142,240,.12);
  --danger:          #e8533a;
  --danger-bg:       rgba(232,83,58,.12);
  --success:         #43b57a;
  --success-bg:      rgba(67,181,122,.12);

  --spark-bar:       #252527;
  --logo-a:          #e8533a;
  --logo-b:          #e89240;

  --shadow:          none;
  --radius-sm:       4px;
  --radius-md:       7px;
  --radius-lg:       10px;

  --font:   'Space Grotesk', system-ui, sans-serif;
  --mono:   'Space Mono', 'Courier New', monospace;
}

/* ══════════════════════════════════════════════════════════════
   THEME: Light
   ══════════════════════════════════════════════════════════════ */
html[data-theme="light"] {
  --bg:    #f4f3f0;
  --s1:    #ffffff;
  --s2:    #f8f7f4;
  --s3:    #eeede9;
  --s4:    #e2e0db;
  --ln:    #e0deda;
  --ln2:   #ccc9c4;
  --tx1:   #1a1917;
  --tx2:   #6b6966;
  --tx3:   #b0ada9;
  --tx4:   #8a8784;
  --sev-critical:    #c93e28;
  --sev-critical-bg: rgba(201,62,40,.09);
  --sev-high:        #c06820;
  --sev-high-bg:     rgba(192,104,32,.09);
  --sev-medium:      #9a7c1a;
  --sev-medium-bg:   rgba(154,124,26,.09);
  --sev-low:         #2e8a56;
  --sev-low-bg:      rgba(46,138,86,.09);
  --sev-info:        #3466c8;
  --sev-info-bg:     rgba(52,102,200,.09);
  --accent:          #3466c8;
  --accent-bg:       rgba(52,102,200,.09);
  --danger:          #c93e28;
  --danger-bg:       rgba(201,62,40,.09);
  --success:         #2e8a56;
  --success-bg:      rgba(46,138,86,.09);
  --spark-bar:       #e0deda;
  --logo-a:          #c93e28;
  --logo-b:          #c06820;
  --shadow:          0 1px 4px rgba(0,0,0,.07);
}

/* ══════════════════════════════════════════════════════════════
   THEME: Midnight Blue
   ══════════════════════════════════════════════════════════════ */
html[data-theme="midnight"] {
  --bg:    #0d1117;
  --s1:    #161b27;
  --s2:    #1c2333;
  --s3:    #232d42;
  --s4:    #2b3650;
  --ln:    #253045;
  --ln2:   #304060;
  --tx1:   #cdd9f5;
  --tx2:   #7d93c5;
  --tx3:   #374060;
  --tx4:   #506080;
  --sev-critical:    #ff7b72;
  --sev-critical-bg: rgba(255,123,114,.12);
  --sev-high:        #ffa657;
  --sev-high-bg:     rgba(255,166,87,.12);
  --sev-medium:      #e3b341;
  --sev-medium-bg:   rgba(227,179,65,.12);
  --sev-low:         #3fb950;
  --sev-low-bg:      rgba(63,185,80,.12);
  --sev-info:        #58a6ff;
  --sev-info-bg:     rgba(88,166,255,.12);
  --accent:          #58a6ff;
  --accent-bg:       rgba(88,166,255,.12);
  --danger:          #ff7b72;
  --danger-bg:       rgba(255,123,114,.12);
  --success:         #3fb950;
  --success-bg:      rgba(63,185,80,.12);
  --spark-bar:       #232d42;
  --logo-a:          #ff7b72;
  --logo-b:          #ffa657;
}

/* ══════════════════════════════════════════════════════════════
   THEME: Solarized Dark
   ══════════════════════════════════════════════════════════════ */
html[data-theme="solarized"] {
  --bg:    #002b36;
  --s1:    #073642;
  --s2:    #0d4555;
  --s3:    #155060;
  --s4:    #1c5d6e;
  --ln:    rgba(101,163,162,.18);
  --ln2:   rgba(101,163,162,.32);
  --tx1:   #fdf6e3;
  --tx2:   #93a1a1;
  --tx3:   #2d5060;
  --tx4:   #586e75;
  --sev-critical:    #dc322f;
  --sev-critical-bg: rgba(220,50,47,.15);
  --sev-high:        #cb4b16;
  --sev-high-bg:     rgba(203,75,22,.15);
  --sev-medium:      #b58900;
  --sev-medium-bg:   rgba(181,137,0,.15);
  --sev-low:         #859900;
  --sev-low-bg:      rgba(133,153,0,.15);
  --sev-info:        #268bd2;
  --sev-info-bg:     rgba(38,139,210,.15);
  --accent:          #268bd2;
  --accent-bg:       rgba(38,139,210,.15);
  --danger:          #dc322f;
  --danger-bg:       rgba(220,50,47,.15);
  --success:         #859900;
  --success-bg:      rgba(133,153,0,.15);
  --spark-bar:       #155060;
  --logo-a:          #dc322f;
  --logo-b:          #cb4b16;
}

/* ══════════════════════════════════════════════════════════════
   THEME: Dracula
   ══════════════════════════════════════════════════════════════ */
html[data-theme="dracula"] {
  --bg:    #191a21;
  --s1:    #21222c;
  --s2:    #282a36;
  --s3:    #343746;
  --s4:    #3e4258;
  --ln:    rgba(98,114,164,.20);
  --ln2:   rgba(98,114,164,.35);
  --tx1:   #f8f8f2;
  --tx2:   #9096b8;
  --tx3:   #383c52;
  --tx4:   #6272a4;
  --sev-critical:    #ff5555;
  --sev-critical-bg: rgba(255,85,85,.13);
  --sev-high:        #ffb86c;
  --sev-high-bg:     rgba(255,184,108,.13);
  --sev-medium:      #f1fa8c;
  --sev-medium-bg:   rgba(241,250,140,.10);
  --sev-low:         #50fa7b;
  --sev-low-bg:      rgba(80,250,123,.11);
  --sev-info:        #8be9fd;
  --sev-info-bg:     rgba(139,233,253,.11);
  --accent:          #bd93f9;
  --accent-bg:       rgba(189,147,249,.13);
  --danger:          #ff5555;
  --danger-bg:       rgba(255,85,85,.13);
  --success:         #50fa7b;
  --success-bg:      rgba(80,250,123,.11);
  --spark-bar:       #343746;
  --logo-a:          #ff5555;
  --logo-b:          #ffb86c;
}

/* ══════════════════════════════════════════════════════════════
   THEME: Nord
   ══════════════════════════════════════════════════════════════ */
html[data-theme="nord"] {
  --bg:    #2e3440;
  --s1:    #3b4252;
  --s2:    #434c5e;
  --s3:    #4c566a;
  --s4:    #576075;
  --ln:    rgba(216,222,233,.10);
  --ln2:   rgba(216,222,233,.20);
  --tx1:   #eceff4;
  --tx2:   #d8dee9;
  --tx3:   #3b4252;
  --tx4:   #8490a8;
  --sev-critical:    #bf616a;
  --sev-critical-bg: rgba(191,97,106,.15);
  --sev-high:        #d08770;
  --sev-high-bg:     rgba(208,135,112,.15);
  --sev-medium:      #ebcb8b;
  --sev-medium-bg:   rgba(235,203,139,.12);
  --sev-low:         #a3be8c;
  --sev-low-bg:      rgba(163,190,140,.14);
  --sev-info:        #88c0d0;
  --sev-info-bg:     rgba(136,192,208,.14);
  --accent:          #88c0d0;
  --accent-bg:       rgba(136,192,208,.14);
  --danger:          #bf616a;
  --danger-bg:       rgba(191,97,106,.15);
  --success:         #a3be8c;
  --success-bg:      rgba(163,190,140,.14);
  --spark-bar:       #4c566a;
  --logo-a:          #bf616a;
  --logo-b:          #d08770;
}

/* ── Base ── */
body {
  font-family: var(--font, 'Space Grotesk', system-ui, sans-serif);
  background:  var(--bg);
  color:       var(--tx1);
  font-size:   13px;
  line-height: 1.5;
  overflow:    hidden;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar       { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--ln2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/frontend/app.jsx"></script>
</body>
</html>
